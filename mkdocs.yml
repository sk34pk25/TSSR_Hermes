site_name: TSSR NEO+
site_description: Documentation de la formation Technicien Supérieur Systèmes & Réseaux
site_url: https://sk34pk25.github.io/TSSR_Hermes/
repo_url: https://github.com/sk34pk25/TSSR_Hermes
repo_name: sk34pk25/TSSR_Hermes
docs_dir: docs
site_dir: site

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Passage en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Passage en mode clair
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.sections
    - navigation.prune
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs
    - content.tabs.linked
  icon:
    repo: fontawesome/brands/github
    logo: material/school

extra_css:
  - assets/stylesheets/tokens.css
  - assets/stylesheets/base.css
  - assets/stylesheets/navigation.css
  - assets/stylesheets/responsive.css
  - assets/stylesheets/homepage.css
  - assets/stylesheets/chronology.css

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.betterem
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - attr_list
  - md_in_html
  - tables
  - admonition
  - def_list
  - footnotes
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - toc:
      permalink: true
      permalink_title: Lien permanent
      toc_depth: 6

nav:
  - Accueil: index.md
  - Parcours: parcours/index.md
  - Cours: cours/index.md
  - Tutoriels: tutoriels/index.md
  - Travaux pratiques: travaux-pratiques/index.md
  - Exercices: exercices/index.md
  - Kahoot: kahoot/index.md
  - Révisions: revisions/index.md
  - Mémos: memos/index.md
  - Commandes: commandes/index.md
  - Dépannage: depannage/index.md
  - Glossaire: glossaire/index.md
  - Ressources: ressources/index.md
  - Index général: index-general/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/
  generator: false
  copyright: Copyright &copy; 2026-2027 TSSR — Formation Technicien Supérieur Systèmes & Réseaux
